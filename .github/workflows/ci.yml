name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run linting
        run: ruff check src/ tests/
      
      - name: Run type checking
        run: mypy src/
      
      - name: Run tests with coverage
        run: pytest tests/
      
      - name: Install build tools
        run: pip install build
      
      - name: Build package
        run: python -m build
      
      - name: Validate package installation
        run: |
          # Create a clean virtual environment
          python -m venv test-env
          source test-env/bin/activate
          
          # Install the built wheel
          pip install dist/*.whl
          
          # Test that the package can be imported
          python -c "from sentry_seer_types import CodeReviewTaskRequest; print('✅ Package import successful')"
          
          # Test that submodule imports work
          python -c "from sentry_seer_types.codegen import CodeReviewTaskRequest; print('✅ Submodule import successful')"
          
          # Cleanup
          deactivate
