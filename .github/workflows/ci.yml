name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Package (Python ${{ matrix.python-version }}, Pydantic ${{ matrix.pydantic-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pydantic-version: ["v1", "v2"]
        include:
          - pydantic-version: "v1"
            pydantic-spec: "pydantic>=1.10.23,<2"
          - pydantic-version: "v2"
            pydantic-spec: "pydantic>=2.6.4"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install dependencies with Pydantic ${{ matrix.pydantic-version }}
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pydantic-spec }}"
          pip install -e ".[dev]"
        working-directory: ${{ github.workspace }}
      
      - name: Run linting
        if: matrix.python-version == '3.11' && matrix.pydantic-version == 'v2'
        run: ruff check src/ tests/
      
      # Type checking with Pydantic v2 only - v2 provides better type inference
      # and the codebase uses modern Python 3.11+ type hints
      - name: Run type checking (Pydantic v2 only)
        if: matrix.pydantic-version == 'v2'
        run: mypy src/
      
      - name: Run tests with coverage
        run: pytest tests/
      
      - name: Install build tools
        if: matrix.python-version == '3.11' && matrix.pydantic-version == 'v2'
        run: pip install build
      
      - name: Build package
        if: matrix.python-version == '3.11' && matrix.pydantic-version == 'v2'
        run: python -m build
      
      - name: Validate package installation
        if: matrix.python-version == '3.11'
        run: |
          # Create a clean virtual environment
          python -m venv test-env
          source test-env/bin/activate
          
          # Install the built wheel (if it exists)
          if [ -d "dist" ]; then
            pip install "${{ matrix.pydantic-spec }}"
            pip install dist/*.whl
          else
            pip install "${{ matrix.pydantic-spec }}"
            pip install -e .
          fi
          
          # Test default imports (v1 models)
          python -c "from sentry_seer_shared_code import SeerCodeReviewTaskRequestForPrReview; print('✅ Default import successful')"
          
          # Test v1 imports
          python -c "from sentry_seer_shared_code.v1 import SeerCodeReviewTaskRequestForPrReview; print('✅ v1 import successful')"
          
          # v2 is placeholder only; no models to import
          python -c "import sentry_seer_shared_code.v2; print('✅ v2 import successful')"
          
          # Cleanup
          deactivate
