name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Package (Python ${{ matrix.python-version }}, Pydantic ${{ matrix.pydantic-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pydantic-version: ["v1", "v2"]
        include:
          - pydantic-version: "v1"
            pydantic-spec: "pydantic>=1.10.23,<2"
          - pydantic-version: "v2"
            pydantic-spec: "pydantic>=2.6.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies with Pydantic ${{ matrix.pydantic-version }}
        run: make install PYDANTIC_SPEC="${{ matrix.pydantic-spec }}"

      - name: Run linting
        if: matrix.python-version == '3.11' && matrix.pydantic-version == 'v2'
        run: make lint

      - name: Run type checking (Pydantic v2 only)
        if: matrix.pydantic-version == 'v2'
        run: make typecheck

      - name: Run tests with coverage
        run: make test

      - name: Build package
        if: matrix.python-version == '3.11' && matrix.pydantic-version == 'v2'
        run: make build

      - name: Validate package installation
        if: matrix.python-version == '3.11'
        run: make validate-install PYDANTIC_SPEC="${{ matrix.pydantic-spec }}"
